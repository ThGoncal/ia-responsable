[project]
name = "ia-responsable"
version = "0.1.0"
description = "Concours Euro-Information 2026 « IA responsable » : heuristiques, recuit simulé et OR-Tools"
readme = "README.md"
authors = [
    { name = "Thierry GONCALVES-NOVO" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.scripts]
ia-responsable = "ia_responsable:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
